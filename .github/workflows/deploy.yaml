name: IaC Deploy
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:


jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: ./k3s
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare credential for Terraform and Ansible
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > ./github-ec2.pem
          chmod 600 ./github-ec2.pem
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd

      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate
        
      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan (Validation)
        run: terraform plan -no-color | tee terraform-plan.txt
      
      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join('k3s', 'terraform-plan.txt');
            let plan = '';
            try {
              plan = fs.readFileSync(planPath, 'utf8');
            } catch (error) {
              core.warning(`Failed to read Terraform plan file at ${planPath}: ${error.message}`);
              plan = 'Terraform plan output is not available.';
            }
            const body = [
              '## Terraform Plan',
              '',
              '```',
              plan,
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
      
      - name: Prepare Secrets for Ansible
        if: github.event_name == 'workflow_dispatch'
        env:
          UNIFIED_SECRETS_CONTENT: ${{ secrets.UNIFIED_SECRETS_CONTENT }}
        run: |
          # restore secret file for ansible
          echo "$UNIFIED_SECRETS_CONTENT" > ./ansible/secrets.env
      - name: Terraform Apply
        # apply only on main branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          terraform apply -auto-approve
      
      - name: Ansible Incremental Config
        if: github.event_name == 'workflow_dispatch'
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/setup-linkerd-certs.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}