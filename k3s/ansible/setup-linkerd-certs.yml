---
- name: Install Step CLI on All nodePortHttps
  hosts: all
  become: true
  vars:
    step_version: "0.24.4"
    step_arch: "amd64"
  tasks:
    - name: Download Step CLI tarball
      get_url:
        url: "https://github.com/smallstep/cli/releases/download/v{{ step_version }}/step_linux_{{ step_version }}_{{ step_arch }}.tar.gz"
        dest: "/tmp/step.tar.gz"
        mode: '0600'

    - name: Extract step binary to /usr/local/bin
      unarchive:
        src: "/tmp/step.tar.gz"
        dest: "/usr/local/bin"
        remote_src: yes
        # --strip-components=2 : extract binary to /usr/local/bin directly, without intermediate folders
        extra_opts:
          - "--strip-components=2"
          - "step_{{ step_version }}/bin/step"
        creates: "/usr/local/bin/step" # skip if already exists

    - name: Verify step installation
      command: step version
      register: step_v
      changed_when: false
      failed_when: step_v.rc != 0

- name: Install cert-manager
  hosts: masters
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Add cert-manager helm repo
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: "https://charts.jetstack.io"

    - name: Install cert-manager via Helm
      kubernetes.core.helm:
        name: cert-manager
        release_namespace: cert-manager
        chart_ref: cert-manager
        chart_repo_url: "https://charts.jetstack.io"
        chart_version: "v1.16.1"
        create_namespace: true
        release_values:
          installCRDs: true
    - name: Wait for cert-manager components to be ready
      shell: |
        kubectl wait --for=condition=available --timeout=300s deployment/cert-manager -n cert-manager
        kubectl wait --for=condition=available --timeout=300s deployment/cert-manager-webhook -n cert-manager
      changed_when: false
- name: Prepare Linkerd mTLS Secrets
  hosts: masters
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    cert_dir: "/etc/linkerd-certs"
  
  tasks:
    - name: Create Linkerd Namespace
      shell: "kubectl create ns linkerd --dry-run=client -o yaml | kubectl apply -f - "
    
    - name: Ensure cert directory has correct permissions
      file:
        path: "{{ cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      become: true
    
    - name: Install pip3 on Ubuntu/Debian
      become: true
      ansible.builtin.apt:
        name: python3-pip
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Python kubernetes library
      become: true
      ansible.builtin.pip:
        name: ["kubernetes", "PyYAML", "jsonpatch"]

    - name: Generate Trust Anchor (Root CA)
      command: >
        step certificate create identity.linkerd.cluster.local {{ cert_dir }}/ca.crt {{ cert_dir }}/ca.key
        --profile root-ca --no-password --insecure
      args:
        creates: "{{ cert_dir }}/ca.crt"

    - name: Create Secret for Root CA (Input for cert-manager)
      shell: |
        kubectl create secret tls linkerd-trust-anchor-source \
          -n linkerd \
          --cert={{ cert_dir }}/ca.crt \
          --key={{ cert_dir }}/ca.key \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Define cert-manager Issuer for Linkerd
      kubernetes.core.k8s:
        state: present
        wait: yes
        definition:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: linkerd-trust-anchor
            namespace: linkerd
          spec:
            ca:
              secretName: linkerd-trust-anchor-source
    
    - name: Define Certificate for Linkerd Identity Issuer
      kubernetes.core.k8s:
        state: present
        wait: yes
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: linkerd-identity-issuer
            namespace: linkerd
          spec:
            secretName: linkerd-identity-issuer
            duration: 720h
            renewBefore: 360h
            issuerRef:
              name: linkerd-trust-anchor
              kind: Issuer
            commonName: identity.linkerd.cluster.local
            dnsNames:
              - identity.linkerd.cluster.local
            isCA: true
            usages:
              - cert sign
              - crl sign

    - name: Check if Linkerd CRDs are already installed
      shell: "kubectl get crd serviceprofiles.linkerd.io"
      register: crd_check
      failed_when: false
      changed_when: false

    - name: Install Linkerd CRDs if missing
      shell: |
        helm repo add linkerd https://helm.linkerd.io/stable
        helm repo update
        helm template linkerd-crds linkerd/linkerd-crds --version 1.8.0 | kubectl apply -f -
      when: crd_check.rc != 0
      register: crd_install
      changed_when: "'created' in crd_install.stdout"

    - name: Wait for CRDs to be established
      shell: "kubectl wait --for condition=established --timeout=60s crd/serviceprofiles.linkerd.io"
      when: crd_check.rc != 0
      changed_when: false

    - name: Label default namespace for Linkerd injection
      shell: "kubectl label ns default linkerd.io/inject=enabled --overwrite"
      changed_when: false

- name: Get Cert from Master
  hosts: masters
  become: true
  gather_facts: false
  tasks:
    - name: Fetch CA content
      ansible.builtin.slurp:
        src: "/etc/linkerd-certs/ca.crt"
      register: remote_ca_file

    - name: Save CA to a dummy host for later use
      add_host:
        name: "CERT_HOLDER"
        ca_content: "{{ remote_ca_file.content }}"

- name: Update GitOps Repository with new CA
  hosts: localhost  
  connection: local
  gather_facts: false
  vars:
    gitops_repo_url: "https://{{ lookup('env', 'GH_TOKEN') }}@github.com/sw5005-sus/ceramicraft-argocd-deploy.git"
    temp_dir: "/tmp/gitops-sync"
    app_yaml_path: "{{ temp_dir }}/app-of-apps.yaml"

  tasks:
    - name: Clone GitOps Repository
      git:
        repo: "{{ gitops_repo_url }}"
        dest: "{{ temp_dir }}"
        depth: 1
        force: yes
      no_log: true

    - name: Replace cert content
      ansible.builtin.replace:
        path: "{{ temp_dir }}/app-of-apps.yaml"
        # regex explain：
        # (?<=# BEGIN ANSIBLE MANAGED CERT) : forward assert, match content after this marker
        # [\s\S]*? : match all characters (including newlines) non-greedily until the next part
        # (?=# END ANSIBLE MANAGED CERT) : backward assert, match content before this marker
        regexp: '(?<=# BEGIN ANSIBLE MANAGED CERT)[\s\S]*?(?=# END ANSIBLE MANAGED CERT)'
        replace: "\n{{ (hostvars['CERT_HOLDER']['ca_content'] | b64decode | trim) | indent(10, first=True) }}\n          "

    - name: Commit and Push changes
      shell: |
        cd {{ temp_dir }}
        git config user.name "Ansible Automation"
        git config user.email "ansible@ceramicraft.local"
        if [ -n "$(git status --porcelain)" ]; then
          echo "Changes detected, committing..."
          git add .
          git commit -m "chore: auto-update linkerd trust anchor [skip ci]"
          git push
        else
          echo "No changes in ca.crt, skipping commit."
        fi
      register: git_push_result
      changed_when: "'Changes detected' in git_push_result.stdout"